services:
  mysql:
    image: mysql:8.4
    container_name: drizzle-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: drizzle_test
      MYSQL_USER: drizzle
      MYSQL_PASSWORD: drizzle
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -udrizzle -pdrizzle --silent && mysql -h 127.0.0.1 -udrizzle -pdrizzle drizzle_test -e 'SELECT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18-alpine
    container_name: drizzle-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drizzle_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drizzle_test"]
      interval: 2s
      timeout: 5s
      retries: 10
