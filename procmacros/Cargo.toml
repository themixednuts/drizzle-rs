[package]
name = "drizzle-macros"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true
doctest = true

[dependencies]
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
syn = { version = "2.0", features = ["full", "visit-mut"] }
rand = { workspace = true }
heck = { version = "0.5" }
pluralizer = { version = "0.5" }
proc-macro-crate = "3.4"
paste = { workspace = true }
# Migration types for metadata generation
drizzle-migrations = { workspace = true }
# Shared type definitions
drizzle-types = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# The macros only generate code, so neither the runtime crates nor any database
# driver is a regular dependency. A proc-macro links its dependencies into the
# compiler plugin: drivers there would build before the macros could run (twice
# in release builds, once for the host), and rusqlite and libsql cannot link
# together because both bundle SQLite.
#
# The doctests compile against the real `drizzle`, and every feature below
# forwards to it. The path-only dependency is stripped on publish, along with
# the `drizzle/...` entries in `[features]`.
[dev-dependencies]
drizzle = { path = ".." }
uuid = { workspace = true }

[features]
default = []
# Each feature is a code-generation switch for the macros. The `drizzle/...`
# entries only apply to this crate's own doctests (see `[dev-dependencies]`).
sqlite = ["drizzle/sqlite"]
postgres = ["drizzle/postgres"]
mysql = ["drizzle/mysql"]
serde = ["drizzle/serde"]
uuid = ["drizzle/uuid"]
arrayvec = ["drizzle/arrayvec"]
chrono = ["drizzle/chrono"]
time = ["drizzle/time"]
rust-decimal = ["drizzle/rust-decimal"]
cidr = ["drizzle/cidr"]
geo-types = ["drizzle/geo-types"]
bit-vec = ["drizzle/bit-vec"]
compact-str = ["drizzle/compact-str"]
bytes = ["drizzle/bytes"]
smallvec = ["drizzle/smallvec-types"]
# SQLite drivers
rusqlite = ["sqlite", "drizzle/rusqlite"]
libsql = ["sqlite", "drizzle/libsql"]
turso = ["sqlite", "drizzle/turso"]
# PostgreSQL drivers
postgres-sync = ["postgres", "drizzle/postgres-sync"]
tokio-postgres = ["postgres", "drizzle/tokio-postgres"]
# AWS Aurora Data API: emits `AwsDataApiRow` conversions alongside the others.
aws-data-api = ["postgres", "drizzle/aws-data-api"]
# Relational query API code generation
query = ["drizzle/query"]
