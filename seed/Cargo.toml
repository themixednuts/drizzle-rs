[package]
name = "drizzle-seed"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Deterministic database seeding for drizzle-rs"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
drizzle-core = { workspace = true, features = ["std"] }
drizzle-types = { workspace = true, features = ["std"] }
drizzle-migrations = { workspace = true, optional = true }
drizzle-sqlite = { workspace = true, optional = true, features = ["std"] }
drizzle-postgres = { workspace = true, optional = true, features = ["std"] }
drizzle-mysql = { workspace = true, optional = true, features = ["std"] }
chrono = { workspace = true, optional = true, features = ["alloc"] }
rand = { workspace = true }

[features]
# No dialect by default — callers opt into sqlite, postgres, and/or mysql.
default = []

sqlite = ["dep:drizzle-sqlite"]
postgres = ["dep:drizzle-postgres"]
mysql = ["dep:drizzle-mysql"]

# `schema::Schema::from_snapshot`, which takes a `drizzle_migrations`
# snapshot (a migration folder's `snapshot.json`, or a driver's
# `introspect()` result).
migrations = ["dep:drizzle-migrations"]

# Weak forwards: type features must not activate a dialect the caller did not
# request (previously `uuid = ["postgres", ...]` pulled drizzle-postgres into
# sqlite-only builds).
serde = ["drizzle-postgres?/serde", "drizzle-sqlite?/serde", "drizzle-mysql?/serde"]
uuid = ["drizzle-postgres?/uuid", "drizzle-sqlite?/uuid", "drizzle-mysql?/uuid"]
chrono = ["dep:chrono", "drizzle-postgres?/chrono", "drizzle-sqlite?/chrono", "drizzle-mysql?/chrono"]
cidr = ["drizzle-postgres?/cidr"]
geo-types = ["drizzle-postgres?/geo-types"]
bit-vec = ["drizzle-postgres?/bit-vec"]
