name: Bench runner family run
description: >-
  Prebuild bench-runner (and any external Rust target crates a family's spec
  spawns), execute one benchmark family, validate its artifacts, upload them,
  and refresh that family's regression baseline cache.

# Why a composite action and not a `workflow_call` reusable workflow:
#
# 1. GitHub does not support conditional service containers, so a single
#    reusable workflow cannot serve both the families that need a PostgreSQL
#    service and the ones that must not have a foreign process on the
#    benchmark VM.
# 2. Each per-OS job invokes this body once per family, back to back, so every
#    family in a ranking is measured on identical hardware. A reusable workflow
#    is a job, so it cannot be invoked more than once per job.
# 3. Composite actions keep the caller job names stable, so branch protection
#    required checks track the OS rather than the family list.

inputs:
  family:
    description: >-
      Target family id (sqlite, postgres, postgres-rust-orms, ...). Combined
      with `platform` into the `<family>-<platform>` slug used for the output
      directory, the artifact name, and the baseline cache key.
    required: true
  platform:
    description: Platform slug (linux, windows, macos).
    required: false
    default: linux
  slug-suffix:
    description: >-
      Extra segment appended to the `<family>-<platform>` slug. A publish run
      measures the same family twice on one workflow — once in its per-family
      job on the paced workload, once in its per-OS job on the saturation ramp —
      and the slug is what keeps the two output directories, artifact names and
      baseline caches apart. Empty for the per-family jobs, so their artifact
      names and cache keys are unchanged.
    required: false
    default: ''
  targets:
    description: Path to the family's target spec (`bench/spec/targets.*.v1.json`).
    required: true
  workload:
    description: Path to the workload spec. Resolved once by the `plan` job.
    required: true
  class:
    description: Run class (small | full | publish). Resolved once by the `plan` job.
    required: true
  cohort-id:
    description: >-
      Cohort id shared by every family in this workflow run. Runs that share a
      cohort id are comparable; runs measured on the same VM additionally share
      hardware.
    required: true
  publish:
    description: '"true" on publish-class runs; controls whether the baseline cache is written.'
    required: false
    default: 'false'
  database-url:
    description: >-
      libpq connection string exported as DATABASE_URL. Empty for families
      without a database service (the runner treats an empty value as "no
      remote database").
    required: false
    default: ''
  prebuild-manifests:
    description: >-
      Whitespace-separated Cargo.toml paths for the external target crates this
      family's spec spawns. They are built with --release before the run so no
      cargo build (or build-lock wait) happens between measured trials.
    required: false
    default: ''
  runner-features:
    description: >-
      Extra cargo features to build `bench-runner` with. A family whose builtin
      targets sit behind a feature gate (libsql) must set this: the prebuilt
      binary becomes `$BENCH_RUNNER_BIN`, and one built without the feature
      rejects that family's target ids.
    required: false
    default: ''
  trials:
    description: Override the class default trial count. Empty keeps the class default.
    required: false
    default: ''
  cpu-isolation:
    description: >-
      `auto` pins the load generator and the spawned target processes to
      disjoint core sets on Linux runners with at least 4 cores. `off` disables
      pinning. No-op on macOS and Windows — the runner's affinity call is
      `#[cfg(target_os = "linux")]`, and Darwin exposes no usable CPU-affinity
      API at all, so there is nothing to fall back to there.
    required: false
    default: auto
  db-cpuset:
    description: >-
      Cores owned by an out-of-process database on this job (the PostgreSQL
      service container's `--cpuset-cpus`, or the cores SpacetimeDB was started
      under `taskset` with). Must be a contiguous top slice of the SUT half of
      the machine; the composite carves it out of `BENCH_CPUSET_SERVER` so
      load / server / database are three disjoint sets, and hard-fails when the
      literal disagrees with what `nproc` reports. Empty for families whose
      engine is in-process — those get the whole SUT half as the server set,
      because for them the server *is* the database.
    required: false
    default: ''

outputs:
  run-id:
    description: Run id emitted by the runner.
    value: ${{ steps.runner.outputs.run_id }}
  out-dir:
    description: Output root for this family (`bench-out/<slug>`).
    value: ${{ steps.setup.outputs.out }}
  slug:
    description: '`<family>-<platform>`, plus `-<slug-suffix>` when one is set.'
    value: ${{ steps.setup.outputs.slug }}

runs:
  using: composite
  steps:
    - name: Resolve run environment
      id: setup
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
        PLATFORM: ${{ inputs.platform }}
        SLUG_SUFFIX: ${{ inputs.slug-suffix }}
      run: |
        slug="${FAMILY}-${PLATFORM}${SLUG_SUFFIX:+-$SLUG_SUFFIX}"
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "out=bench-out/$slug" >> "$GITHUB_OUTPUT"
        # The `env` context is not dependably readable from composite-action
        # `if:` expressions, so surface act mode as a step output instead.
        if [[ -n "${ACT:-}" ]]; then
          echo "act=true" >> "$GITHUB_OUTPUT"
        else
          echo "act=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore runner baseline
      if: ${{ steps.setup.outputs.act != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.setup.outputs.out }}/runs
        key: runner-baseline-${{ steps.setup.outputs.slug }}-
        restore-keys: |
          runner-baseline-${{ steps.setup.outputs.slug }}-

    - name: Prebuild benchmark binaries
      shell: bash
      env:
        MANIFESTS: ${{ inputs.prebuild-manifests }}
        RUNNER_FEATURES: ${{ inputs.runner-features }}
      run: |
        # One release build up front. Target specs invoke the runner as
        # `$BENCH_RUNNER_BIN`, and external targets are launched from prebuilt
        # release binaries, so nothing compiles once measurement starts.
        features_arg=()
        if [[ -n "$RUNNER_FEATURES" ]]; then
          features_arg=(--features "$RUNNER_FEATURES")
        fi
        cargo build --release -p bench-runner "${features_arg[@]}"

        bin="$GITHUB_WORKSPACE/target/release/bench-runner"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          bin="${bin}.exe"
        fi
        if [[ ! -f "$bin" ]]; then
          echo "prebuilt bench-runner is missing at $bin"
          exit 1
        fi
        echo "BENCH_RUNNER_BIN=$bin" >> "$GITHUB_ENV"
        "$bin" --version

        for manifest in $MANIFESTS; do
          echo "prebuilding external target crate: $manifest"
          cargo build --release --manifest-path "$manifest"
        done

    - name: Run contract runner
      id: runner
      shell: bash
      env:
        BENCH_CLASS: ${{ inputs.class }}
        BENCH_WORKLOAD: ${{ inputs.workload }}
        BENCH_TARGETS: ${{ inputs.targets }}
        BENCH_OUT: ${{ steps.setup.outputs.out }}
        BENCH_COHORT: ${{ inputs.cohort-id }}
        BENCH_TRIALS: ${{ inputs.trials }}
        CPU_ISOLATION: ${{ inputs.cpu-isolation }}
        DB_CPUSET: ${{ inputs.db-cpuset }}
        DATABASE_URL: ${{ inputs.database-url }}
      run: |
        mkdir -p "$BENCH_OUT"

        # ------------------------------------------------------------------
        # CPU separation (Linux only).
        #
        # The machine is cut in half. The lower half drives load; the upper
        # half is the system under test and nothing else runs there. How the
        # SUT half is subdivided is a property of the architecture being
        # measured, not of the family:
        #
        #   in-process engine (sqlite, libsql, turso)
        #     server = whole SUT half. The process that serves HTTP is also
        #     the process that executes the query, so it gets the half.
        #
        #   out-of-process engine (postgres*, spacetimedb)
        #     database = `db-cpuset` (a contiguous top slice of the SUT half,
        #     applied by the caller via `--cpuset-cpus` on the service
        #     container or `taskset` on the daemon)
        #     server   = the rest of the SUT half, i.e. the client process.
        #
        # Either way the SUT owns exactly the same cores, which is what makes
        # a cross-family ranking on one box mean anything. Before this, the
        # PostgreSQL service floated unpinned over the whole VM while the
        # embedded engines were confined to the upper half — a silent handicap
        # for every in-process engine in the same table.
        #
        # This is still a partition of a shared VM, not isolation: memory
        # bandwidth, last-level cache and the kernel network stack stay shared.
        #
        # ubuntu-latest is 4 vCPU, so the split is load=0-1, server=2, db=3 for
        # the out-of-process families and load=0-1, server=2-3 for the rest.
        # Derived from nproc rather than hard-coded, so a larger runner keeps a
        # balanced split; the `db-cpuset` literal is cross-checked against it
        # instead of being trusted.
        # ------------------------------------------------------------------
        cpuset_expand() {
          local spec="$1" part lo hi i
          local -a parts=()
          IFS=',' read -ra parts <<< "$spec"
          for part in "${parts[@]}"; do
            part="${part// /}"
            [[ -z "$part" ]] && continue
            if [[ "$part" == *-* ]]; then
              lo="${part%%-*}"; hi="${part##*-}"
            else
              lo="$part"; hi="$part"
            fi
            [[ "$lo" =~ ^[0-9]+$ && "$hi" =~ ^[0-9]+$ ]] || return 1
            (( hi >= lo )) || return 1
            for (( i = lo; i <= hi; i++ )); do echo "$i"; done
          done
        }

        if [[ "$CPU_ISOLATION" == "auto" && "$RUNNER_OS" == "Linux" ]]; then
          cores="$(nproc 2>/dev/null || echo 0)"
          if (( cores >= 4 )); then
            half=$(( cores / 2 ))
            sut_lo="$half"
            sut_hi=$(( cores - 1 ))
            server_hi="$sut_hi"

            if [[ -n "$DB_CPUSET" ]]; then
              # Command substitution, not process substitution: `mapfile` would
              # report its own status and swallow a parse failure.
              if ! db_expanded="$(cpuset_expand "$DB_CPUSET")" || [[ -z "$db_expanded" ]]; then
                echo "::error::db-cpuset '$DB_CPUSET' is not a valid cpuset spec"
                exit 1
              fi
              mapfile -t db_cores <<< "$db_expanded"
              db_lo="${db_cores[0]}"
              db_hi="${db_cores[${#db_cores[@]} - 1]}"
              # Contiguous, inside the SUT half, ending at its top, and leaving
              # at least one core for the client process. Any violation means
              # the literal in `runners.yml` and the real core count have
              # drifted apart, which would silently overlap two of the three
              # sets — fail instead.
              if (( db_hi - db_lo + 1 != ${#db_cores[@]} )); then
                echo "::error::db-cpuset '$DB_CPUSET' is not contiguous"
                exit 1
              fi
              if (( db_lo < sut_lo || db_hi != sut_hi )); then
                echo "::error::db-cpuset '$DB_CPUSET' must be a top slice of the SUT half ${sut_lo}-${sut_hi} on a ${cores}-core runner"
                exit 1
              fi
              if (( db_lo <= sut_lo )); then
                echo "::error::db-cpuset '$DB_CPUSET' leaves no core for the target process on a ${cores}-core runner"
                exit 1
              fi
              server_hi=$(( db_lo - 1 ))
            fi

            # A one-core set is written as `2`, not `2-2`. The parser accepts
            # both, but this string is what the dashboard prints as the run's
            # isolation disclosure, and `server=2-2` reads like a typo.
            cpuset_range() {
              if (( $1 == $2 )); then echo "$1"; else echo "$1-$2"; fi
            }

            export BENCH_CPUSET_LOAD="$(cpuset_range 0 $(( half - 1 )))"
            export BENCH_CPUSET_SERVER="$(cpuset_range "$sut_lo" "$server_hi")"
            # The runner cannot pin a process it did not spawn, so this is
            # disclosure only: it makes `topology.cpu_pinning` describe the
            # three-way split the caller actually set up.
            if [[ -n "$DB_CPUSET" ]]; then
              export BENCH_CPUSET_DB="$DB_CPUSET"
            fi
            echo "cpu isolation: load=$BENCH_CPUSET_LOAD server=$BENCH_CPUSET_SERVER db=${DB_CPUSET:-<in-process>} (of $cores cores)"
          else
            echo "cpu isolation: skipped, runner reports $cores cores"
          fi
        else
          # macOS and Windows land here. `manifest.runner.topology.cpu_pinning`
          # is null on those runs by construction, and that is the honest
          # record: nothing was pinned.
          echo "cpu isolation: disabled (mode=$CPU_ISOLATION os=$RUNNER_OS)"
        fi

        trials_arg=()
        if [[ -n "$BENCH_TRIALS" ]]; then
          trials_arg=(--trials "$BENCH_TRIALS")
        fi

        "$BENCH_RUNNER_BIN" run \
          --suite throughput-http \
          --workload "$BENCH_WORKLOAD" \
          --targets "$BENCH_TARGETS" \
          --requests bench/spec/requests.empty.v1.json \
          --out "$BENCH_OUT" \
          --cohort-id "$BENCH_COHORT" \
          --class "$BENCH_CLASS" \
          --baseline auto \
          "${trials_arg[@]}" \
          --json | tee runner_output.txt

        run_id="$(grep '^run_id=' runner_output.txt | tail -n1 | cut -d= -f2)"
        if [[ -z "$run_id" ]]; then
          echo "run_id was not emitted"
          exit 1
        fi
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Validate runner artifacts
      shell: bash
      env:
        BENCH_WORKLOAD: ${{ inputs.workload }}
        BENCH_TARGETS: ${{ inputs.targets }}
        BENCH_OUT: ${{ steps.setup.outputs.out }}
        RUN_ID: ${{ steps.runner.outputs.run_id }}
      run: |
        "$BENCH_RUNNER_BIN" validate \
          --run "$BENCH_OUT/runs/$RUN_ID" \
          --workload "$BENCH_WORKLOAD" \
          --targets "$BENCH_TARGETS"

    - name: Upload runner artifacts
      if: ${{ steps.setup.outputs.act != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: runner-${{ steps.setup.outputs.slug }}
        path: |
          ${{ steps.setup.outputs.out }}/runs/${{ steps.runner.outputs.run_id }}
          runner_output.txt
        retention-days: 30

    # On failure the run step never emits run_id (e.g. a parity divergence),
    # but the run dir with parity snapshots exists and is exactly what is
    # needed to diagnose. Upload the whole runs dir; restored baselines may
    # ride along, so keep retention short.
    - name: Upload failed-run diagnostics
      if: ${{ failure() && steps.setup.outputs.act != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: runner-${{ steps.setup.outputs.slug }}-failed
        path: |
          ${{ steps.setup.outputs.out }}/runs
          runner_output.txt
        retention-days: 7
        if-no-files-found: warn

    - name: Save runner baseline
      if: ${{ inputs.publish == 'true' && steps.setup.outputs.act != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.setup.outputs.out }}/runs/${{ steps.runner.outputs.run_id }}
        key: runner-baseline-${{ steps.setup.outputs.slug }}-${{ github.sha }}
