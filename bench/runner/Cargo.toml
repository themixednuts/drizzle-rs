[package]
name = "bench-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bench-runner"
path = "src/main.rs"

[features]
default = []
# libsql benchmark family. Off by default and Linux-only in CI: libsql has a
# history of crashing the benchmark process on Windows and macOS, and the
# Windows/macOS SQLite jobs must stay unaffected. Enabling it links libsql-ffi
# alongside rusqlite's bundled SQLite, which only works while the workspace
# stays on rusqlite 0.39 (see the pin comment in the root Cargo.toml).
#
# Windows/MSVC builds of this feature can fail *intermittently on the first
# build* with `assertion failed: Build::new()...arg("-o").arg(rlemon...)` from
# libsql-sqlite3-parser's build script. That script compiles its `lemon` tool
# with `cl -o`, and cl writes the intermediate `lemon.obj` into the build
# script's cwd — the shared registry source dir — while cargo schedules the
# script for two dependency configurations in parallel; the two cl processes
# race on that one path. Rerunning the build succeeds (only the lost
# configuration reruns, alone). The real fix is upstream: the script needs
# `.current_dir(&out_dir)` (or an explicit `/Fo`) so each configuration keeps
# its object file in its own OUT_DIR. gcc/clang emit no cwd intermediate, so
# Linux/macOS never see this.
libsql = ["dep:libsql", "drizzle/libsql"]

[dependencies]
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "formatting"] }
sha2 = { workspace = true }
rand = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio"] }
drizzle = { workspace = true, features = ["postgres-sync", "tokio-postgres", "rusqlite", "turso", "chrono", "query"] }
# The benchmark handlers select up to 19 columns in a single tuple. The umbrella
# `drizzle` crate does not forward the tuple-arity features, so depend on
# drizzle-core directly purely to turn on `col32` (features unify across the
# build graph). Not otherwise used by this crate.
drizzle-core = { workspace = true, features = ["std", "col32"] }
drizzle-seed = { workspace = true, default-features = false, features = ["sqlite", "postgres", "chrono"] }
chrono = { workspace = true, features = ["serde"] }
postgres = { workspace = true, features = ["with-chrono-0_4"] }
tokio-postgres = { workspace = true, features = ["runtime", "with-chrono-0_4"] }
rusqlite = { workspace = true }
turso = { workspace = true }
libsql = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
sysinfo = { version = "0.39.6" }
jsonschema = { version = "0.49.2", default-features = false, features = ["resolve-file"] }
parquet = { version = "59.1.0", default-features = false }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
