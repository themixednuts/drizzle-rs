[package]
name = "spacetime-native-rs"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "spacetime-native-rs"
path = "src/main.rs"

[dependencies]
spacetimedb-sdk = "2.8.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
# HTTP client for the `--module-procedures` forwarder (spacetime-module-rs).
bytes = "1"
http-body-util = "0.1.4"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
