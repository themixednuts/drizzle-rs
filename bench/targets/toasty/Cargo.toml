[package]
name = "bench-target-toasty"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "bench-target-toasty"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
# Only used to build + seed the SQLite/Turso database so the toasty target's
# rows are byte-identical to the built-in turso targets. Toasty owns the
# query path.
drizzle = { path = "../../..", default-features = false, features = ["std", "turso", "chrono"] }
drizzle-seed = { path = "../../../seed", default-features = false, features = ["sqlite", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
tempfile = "3.23"
jiff = "0.2"
toasty = { version = "0.9.0", features = ["postgresql", "turso", "jiff"] }
toasty-driver-turso = "0.9.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
turso = { version = ">=0.7, <0.8", default-features = false, features = ["pure-rust-crypto"] }
