[package]
name = "bench-target-rust-pg-orms"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.11", default-features = false, features = ["postgres", "chrono"] }
pq-sys = { version = "0.7.5", default-features = false, features = ["bundled_without_openssl"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-chrono", "with-json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
sysinfo = "0.39.6"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
