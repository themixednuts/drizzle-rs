[package]
name = "drizzle-mysql"
version.workspace = true
edition.workspace = true
authors.workspace = true
keywords.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# WIP driver, but published in lockstep with the workspace: the umbrella's
# `mysql` feature depends on this crate with an exact version pin, so keeping
# it off crates.io would leave that feature resolving a stale stub (releases
# 0.1.6..0.1.15 resolved drizzle-mysql 0.1.5) and break the release pipeline.

[dependencies]
drizzle-core = { workspace = true, features = ["alloc"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["drizzle-core/std"]
# Allocator support for no_std (forwarded features are always enabled since this
# crate requires allocation unconditionally; flag retained for API clarity).
alloc = []

serde = ["dep:serde_json", "dep:serde"]
uuid = ["dep:uuid"]
